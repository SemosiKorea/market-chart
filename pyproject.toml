[project]
name = "market-signal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    "ib-insync>=0.9.86",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "websockets>=13",
]

[project.scripts]
kis-auth-smoke = "market_signal.cli.kis_auth_smoke:main"
kis-qqq-rest-smoke = "market_signal.cli.kis_qqq_rest_smoke:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
